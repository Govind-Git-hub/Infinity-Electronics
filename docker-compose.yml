services:
  mongo:
    image: mongo:7
    container_name: ie-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ie-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker, Mongo is the service name "mongo", not localhost
      MONGO_URI: mongodb://mongo:27017/infinity-electronics
      PORT: 5000
    volumes:
      # Live code reload: your PC folder → container
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ie-frontend
    ports:
      - "5173:5173"
    environment:
      # Browser runs on your PC, so API is still localhost:5000
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data: